<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zalan Birtalan — Portfolio</title>
  <meta name="description" content="Student developer and founder of the streetwear brand ALAN BIRTH. Projects, skills, live GitHub activity and a downloadable CV.">
  <meta name="theme-color" content="#07070c">
  <meta property="og:title" content="Zalan Birtalan — Portfolio">
  <meta property="og:description" content="Student developer · founder of ALAN BIRTH.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF5B3A'/%3E%3Cstop offset='.5' stop-color='%23A35BFF'/%3E%3Cstop offset='1' stop-color='%234D6BFE'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ctext x='16' y='21' font-family='Arial' font-size='13' font-weight='900' fill='%23fff' text-anchor='middle'%3EZB%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- ?v= : új kiadásnál emeld, különben a böngésző a régi fájlt használhatja -->
  <link rel="stylesheet" href="assets/css/style.css?v=5">
  <!-- a beúszó animáció csak akkor rejt el bármit, ha a JS fut; hiba esetén minden látszik -->
  <script>document.documentElement.classList.add("js"); addEventListener("error", function (e) { if (e.filename && e.filename.indexOf("/assets/js/") > -1) document.documentElement.className = ""; });</script>
</head>
<body>
  <!-- Háttér: csak CSS, nincs kép -->
  <div class="bg" aria-hidden="true">
    <div class="aurora aurora--a"></div>
    <div class="aurora aurora--b"></div>
    <div class="aurora aurora--c"></div>
    <div class="dots"></div>
    <div class="dots dots--lit"></div>
    <div class="grain"></div>
  </div>

  <div class="progress" aria-hidden="true"><span></span></div>

  <header class="nav-wrap">
    <nav class="nav" aria-label="Main">
      <a class="nav__mark" href="#index" aria-label="Home">ZB</a>
      <ul class="nav__links" id="navLinks"></ul>
      <a class="nav__cta cv-link" download>CV ↓</a>
    </nav>
  </header>

  <main>
    <!-- HERO -->
    <section class="hero" id="index">
      <div class="hero__main">
        <div class="chip mono reveal"><span class="pulse"></span><span id="heroChip"></span></div>
        <h1 class="hero__name reveal" id="heroName"></h1>
        <p class="hero__role mono reveal" id="heroRole"></p>
        <p class="hero__tagline reveal" id="heroTagline"></p>
        <div class="hero__actions reveal">
          <a class="btn btn--grad cv-link" download><span data-ui="cv"></span> <span class="btn__ext mono">PDF ↓</span></a>
          <a class="btn btn--ghost" href="#work"><span data-ui="work"></span> →</a>
        </div>
      </div>

      <aside class="idcard reveal" aria-label="Quick facts">
        <div class="idcard__head mono"><span>ID</span><span>// bizaza</span></div>
        <dl class="idcard__list mono" id="idcard"></dl>
        <div class="idcard__status mono" id="heroStatus"></div>
      </aside>
    </section>

    <!-- MARQUEE -->
    <div class="marquee" aria-hidden="true"><div class="marquee__track mono" id="marquee"></div></div>

    <!-- STATS -->
    <section class="stats reveal" id="stats" aria-label="Numbers"></section>

    <!-- PROJECTS -->
    <section class="section" id="work">
      <header class="section__head reveal">
        <span class="section__idx mono">01 /</span>
        <h2 data-ui="work"></h2>
        <p data-ui="workSub"></p>
      </header>
      <div class="projects" id="projects"></div>

      <header class="subhead reveal">
        <h3 class="mono" data-ui="latest"></h3>
        <p data-ui="latestSub"></p>
      </header>
      <div class="repos" id="ghRepoList"></div>
    </section>

    <!-- STACK -->
    <section class="section" id="stack">
      <header class="section__head reveal">
        <span class="section__idx mono">02 /</span>
        <h2 data-ui="stack"></h2>
        <p data-ui="stackSub"></p>
      </header>
      <div class="legend mono reveal" id="legend"></div>
      <div class="stack" id="stackGrid"></div>
    </section>

    <!-- WORK ACTIVITY: GitHub + Claude egy naptárban -->
    <section class="section" id="activity">
      <header class="section__head reveal">
        <span class="section__idx mono">03 /</span>
        <h2 data-ui="gh"></h2>
        <p><span data-ui="ghSub"></span> <a class="mono link" id="ghProfile" target="_blank" rel="noopener"></a></p>
      </header>

      <div class="act">
        <div class="card act-cal reveal">
          <div class="act-cal__head">
            <div class="seg mono" id="actTabs" role="tablist" aria-label="Activity source">
              <button type="button" role="tab" data-mode="all" class="is-on">All</button>
              <button type="button" role="tab" data-mode="code">Code</button>
              <button type="button" role="tab" data-mode="claude">Claude</button>
            </div>
            <div class="act-cal__sum"><strong class="big" id="actTotal">—</strong> <span class="muted" id="actTotalLabel"></span></div>
          </div>
          <div class="gh-cal__scroll"><div class="act-grid" id="actCal" role="img" aria-label="Activity calendar"></div></div>
          <div class="gh-cal__months mono" id="actMonths"></div>
          <div class="act-legend mono" id="actLegend"></div>
        </div>

        <div class="act-kpis" id="actKpis"></div>

        <div class="card act-week reveal">
          <h3 class="mono small">Active days by weekday</h3>
          <div class="week" id="actWeek"></div>
        </div>

        <div class="card gh-lang reveal">
          <h3 class="mono small" data-ui="languages"></h3>
          <div class="lang-bar" id="ghLangBar"></div>
          <ul class="lang-list mono" id="ghLangList"></ul>
        </div>

        <div class="card gh-feed reveal">
          <h3 class="mono small" data-ui="recent"></h3>
          <ul id="ghFeed" class="feed mono"></ul>
        </div>
      </div>
      <div class="tip mono" id="actTip" hidden></div>
    </section>

    <!-- CONTACT -->
    <section class="section contact" id="contact">
      <span class="section__idx mono reveal">04 /</span>
      <h2 class="contact__title reveal">Let’s build<br><span class="grad">something.</span></h2>
      <p class="contact__sub reveal" data-ui="contactSub"></p>
      <a class="contact__mail reveal" id="contactMail"></a>
      <div class="contact__links reveal" id="contactLinks"></div>
    </section>
  </main>

  <footer class="footer mono">
    <span data-ui="built"></span>
    <span><span data-ui="updated"></span> <span id="updated"></span></span>
  </footer>

  <!-- Parancspaletta (Ctrl K / ⌘K / "/") — rejtett, nincs kiírva -->
  <div class="palette" id="palette" hidden>
    <div class="palette__box" role="dialog" aria-modal="true" aria-label="Command palette">
      <input class="palette__input mono" id="paletteInput" type="text" autocomplete="off" spellcheck="false">
      <ul class="palette__list mono" id="paletteList" role="listbox"></ul>
    </div>
  </div>

  <noscript><p class="noscript">This portfolio renders from data with JavaScript. Please enable it.</p></noscript>

  <script src="assets/js/data.js?v=5"></script>
  <script src="assets/js/github.js?v=5"></script>
  <script src="assets/js/main.js?v=5"></script>
</body>
</html>
